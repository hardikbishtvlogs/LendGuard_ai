services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lendguard}
      POSTGRES_USER: ${POSTGRES_USER:-lendguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 5s, timeout: 3s, retries: 20}
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lendguard}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lendguard}
      MODEL_PATH: /ml/artifacts/model.joblib
    depends_on: {db: {condition: service_healthy}}
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args: {NEXT_PUBLIC_API_URL: ""}
    restart: unless-stopped
    environment: {BACKEND_INTERNAL_URL: http://backend:8000}
    depends_on: [backend]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes: ["./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [frontend, backend]
volumes: {postgres_data: {}}
